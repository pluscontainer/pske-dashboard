name: Zizmor Workflow Lint

on:
  push:
    branches:
    - master
    - hotfix-*
    paths:
    - '.github/**'
  pull_request:
    paths:
    - '.github/**'

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          # renovate: datasource=github-releases depName=zizmorcore/zizmor
          version: 1.31.1
          min-severity: low
          min-confidence: low
          advanced-security: false
          annotations: true
